spring.application.name=API-commerce-pw
server.port=8081

# Configuração da ligação ao PostgreSQL

# Configuração do JPA / Hibernate
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
